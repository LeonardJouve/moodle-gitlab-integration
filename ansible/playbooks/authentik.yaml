- name: Deploy Authentik
  hosts: dev
  become: yes

  vars:
    authentik_dir: /opt/authentik

  tasks:
    - name: Create directory
      file:
        path: "{{ authentik_dir }}"
        state: directory

    - name: Copy compose file from local
      copy:
        src: docker/authentik.yaml
        dest: "{{ authentik_dir }}/docker-compose.yml"

    - name: Create blueprints directory
      file:
        path: "{{ authentik_dir }}/blueprints"
        state: directory

    - name: Create blueprint from template
      ansible.builtin.template:
        src: res/moodle-authentik.yaml
        dest: "{{ authentik_dir }}/blueprints/moodle.yml"

    - name: Create icons directory
      file:
        path: "{{ authentik_dir }}/icons"
        state: directory

    - name: Copy icon file from local
      copy:
        src: res/moodle.svg
        dest: "{{ authentik_dir }}/icons/moodle.svg"

    - name: Check if env exists
      stat:
        path: "{{ authentik_dir }}/.env"
      register: env_file

    - name: Generate secrets
      set_fact:
        pg_pass: "{{ lookup('ansible.builtin.pipe', 'openssl rand -base64 36 | tr -d \"\\n\"') }}"
        authentik_secret: "{{ lookup('ansible.builtin.pipe', 'openssl rand -base64 60 | tr -d \"\\n\"') }}"
      when: not env_file.stat.exists

    - name: Create env file
      copy:
        dest: "{{ authentik_dir }}/.env"
        content: |
          PG_PASS="{{ pg_pass }}"
          AUTHENTIK_SECRET_KEY="{{ authentik_secret }}"
          AUTHENTIK_EXTERNAL_URL={{ authentik_external_url }}
          AUTHENTIK_EXTERNAL_HOST={{ authentik_external_host }}
      when: not env_file.stat.exists

    - name: Start stack with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ authentik_dir }}"
        state: present
    
    - name: Wait for authentik startup
      ansible.builtin.uri:
        url: "{{ authentik_external_url }}/"
        method: GET
      register: _result
      until: _result.status == 200
      retries: 30
      delay: 5

    - name: Apply blueprint
      community.docker.docker_container_exec:
        container: authentik-server
        command: ak apply_blueprint /blueprints/moodle.yml